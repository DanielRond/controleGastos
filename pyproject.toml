[project]
name = "controlegastos"
version = "0.1.0"
description = "Gera planilhas Excel de controle de gastos pessoais a partir de JSON"
readme = "README.md"
authors = [
    { name = "DanielRond", email = "danieldossantos1818@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
controlegastos = "controlegastos:main"

[project.optional-dependencies]
# Interface web e armazenamento (specs/interface-web, specs/armazenamento)
web = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "pwdlib[argon2]>=0.3,<1",
    "python-multipart>=0.0.33,<1",
    "itsdangerous>=2.2,<3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.100,<7",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
