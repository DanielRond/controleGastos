name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instala uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sincroniza dependências
        run: uv sync --extra web

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testes (pytest)
        run: uv run pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Instala Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Cliente da API em dia (gerado do OpenAPI)
        run: |
          npm run api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build
        run: npm run build
