name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instala uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sincroniza dependências
        run: uv sync --extra web

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testes (pytest)
        run: uv run pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Instala Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Cliente da API em dia (gerado do OpenAPI)
        run: |
          npm run api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instala uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Instala dependências Python
        run: uv sync --extra web

      - name: Instala Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências do front-end
        run: npm ci
        working-directory: frontend

      - name: Compila o front-end (servido pela API)
        run: npm run build
        working-directory: frontend

      - name: Instala o navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: frontend

      - name: Guarda os rastros dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
