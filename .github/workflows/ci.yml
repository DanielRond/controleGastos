name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instala uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sincroniza dependências
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Testes (pytest)
        run: uv run pytest